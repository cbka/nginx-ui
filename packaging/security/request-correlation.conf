# Include within http{}. The Nginx-generated ID is independent of request headers.
# Existing child Lua filter handlers must explicitly call the same helpers;
# Nginx does not merge inherited Lua filters. Access-log overrides also need
# their own request_id field. Configure lua_package_path for these helpers.
header_filter_by_lua_file /usr/local/lua/nginx-ui/request-reference-header.lua;
body_filter_by_lua_file /usr/local/lua/nginx-ui/request-reference-body.lua;
modsecurity_transaction_id '$request_id';

# Separate from application access logs; no query string, body, cookies or tokens.
# Keep request_id as a JSON field, never a Loki index label (high cardinality).
log_format nginx_ui_request_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"node":"$hostname","host":"$host","server_name":"$server_name",'
    '"client_ip":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status,"request_time":$request_time}';
# Optional when no existing access log can be extended:
# access_log /var/log/nginx/request-correlation.log nginx_ui_request_json;
