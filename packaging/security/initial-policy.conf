# nginx-ui-security-center: {"mode":"DetectionOnly","paranoia_level":1,"inbound_threshold":5,"outbound_threshold":4,"excluded_rule_ids":[]}
Include "/etc/modsecurity/modsecurity.conf"
SecRuleEngine DetectionOnly
Include "/etc/modsecurity/crs/crs-setup.conf"
SecAction "id:900110,phase:1,pass,nolog,setvar:tx.paranoia_level=1"
SecAction "id:900120,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
Include "/usr/share/modsecurity-crs/rules/*.conf"
