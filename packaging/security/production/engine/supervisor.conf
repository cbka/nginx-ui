[unix_http_server]
file=/run/engine-supervisor.sock
chmod=0600
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/engine-supervisord.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/engine-supervisor.sock
[program:crowdsec]
command=/usr/bin/python3 /usr/local/lib/nginx-ui-security/engine/start.py
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:control]
command=/usr/bin/python3 /usr/local/lib/nginx-ui-security/engine/control.py
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
