# Rule engine mode is set by Security Center after this include.
SecRequestBodyAccess On
# Based on ModSecurity v3.0.14 modsecurity.conf-recommended. IDs 200000-200008
# are baseline rules outside the CRS 9xxxxx range managed by Security Center.
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml(?:\s*;|$)" "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json(?:\s*;|$)" "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json(?:\s*;|$)" "id:200006,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRequestBodyJsonDepthLimit 512
SecArgumentsLimit 1000
SecRule &ARGS "@ge 1000" "id:200007,phase:2,t:none,log,deny,status:400,msg:'Request body argument limit exceeded',severity:2"
SecRule REQBODY_ERROR "!@eq 0" "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body',severity:2"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" "id:200003,phase:2,t:none,log,deny,status:400,msg:'Multipart request body failed strict validation',severity:2"
SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" "id:200004,phase:2,t:none,log,deny,status:400,msg:'Multipart boundary validation failed'"
SecRule TX:/^MSC_/ "!@streq 0" "id:200005,phase:2,t:none,log,deny,status:400,msg:'ModSecurity internal error flagged'"
SecRule INBOUND_DATA_ERROR "!@eq 0" "id:200008,phase:2,t:none,log,deny,status:413,msg:'Request body exceeds inspection limit'"
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogType Serial
SecAuditLogFormat JSON
# No request/response bodies or headers. Rule match data is stripped by the collector.
SecAuditLogParts AHZ
SecAuditLog /var/log/nginx/modsecurity-audit.log
SecTmpDir /tmp
SecDataDir /tmp
# CRS may add audit sections at runtime (e.g. +E for matched XSS). Remove sensitive
# sections again in logging phase, before serialization. Keep A/H/Z diagnostics.
SecAction "id:200009,phase:5,pass,nolog,t:none,ctl:auditLogParts=-BCDEFIJK"
