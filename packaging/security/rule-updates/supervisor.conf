
[program:crs-rule-updater]
command=/usr/bin/python3 /usr/local/lib/nginx-ui-security/crs_update.py
priority=40
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
