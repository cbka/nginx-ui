worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
 resolver 127.0.0.11 valid=5s ipv6=off;
 access_log off;
 map $http_upgrade $connection_upgrade { default upgrade; "" close; }
 server { listen 4181; location / {
 set $backend node1:9000;
 proxy_pass http://$backend;
 proxy_http_version 1.1;
 proxy_set_header Host $http_host;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_read_timeout 60s;
 } }
 server { listen 4182; location / {
 set $backend node2:9000;
 proxy_pass http://$backend;
 proxy_http_version 1.1;
 proxy_set_header Host $http_host;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_read_timeout 60s;
 } }
 server { listen 4183; location / {
 set $backend node3:9000;
 proxy_pass http://$backend;
 proxy_http_version 1.1;
 proxy_set_header Host $http_host;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_read_timeout 60s;
 } }
 server { listen 4184; location / {
 set $backend faker:4184;
 proxy_pass http://$backend;
 proxy_http_version 1.1;
 proxy_set_header Host $http_host;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_read_timeout 60s;
 } }
 server { listen 8181; location / {
 set $backend node1:80;
 proxy_pass http://$backend;
 proxy_http_version 1.1;
 proxy_set_header Host $http_host;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_read_timeout 60s;
 } }
 server { listen 8182; location / {
 set $backend node2:80;
 proxy_pass http://$backend;
 proxy_http_version 1.1;
 proxy_set_header Host $http_host;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_read_timeout 60s;
 } }
 server { listen 8183; location / {
 set $backend node3:80;
 proxy_pass http://$backend;
 proxy_http_version 1.1;
 proxy_set_header Host $http_host;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_read_timeout 60s;
 } }
}
