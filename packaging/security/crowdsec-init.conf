# Include once within http{}; site policies install their own access hook.
lua_package_path '/usr/local/lua/crowdsec/?.lua;/usr/local/lua/nginx-ui/?.lua;;';
lua_shared_dict crowdsec_cache 50m;
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
init_by_lua_block {
    local cs = require "crowdsec"
    local ok, err = cs.init("/etc/crowdsec/bouncers/crowdsec-nginx-bouncer.conf", "crowdsec-nginx-bouncer/v1.2.3")
    if ok == nil then error(err) end
    require("nginx_ui_security_events").install()
    -- Read the private AppSec key before worker privilege drop; absent config stays off.
    require("nginx_ui_appsec").init()
}
init_worker_by_lua_block {
    local cs = require "crowdsec"
    if string.lower(cs.get_mode()) == "stream" then cs.SetupStream() end
    if ngx.worker.id() == 0 then cs.SetupMetrics() end
}
